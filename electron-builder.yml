# electron-builder 配置
# NSIS 安装版通过现有公开 GitHub Releases 检查更新；本地构建默认不上传。
appId: com.deepseek-ai.dsh-desktop
productName: DeepSeek Harness Desktop
copyright: Copyright © 2025 DSH Desktop Contributors

directories:
  buildResources: assets
  output: dist

files:
  - src/**
  - assets/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.png
  # 使用无空格的稳定文件名，确保 latest.yml URL 与实际发布资产完全一致。
  artifactName: DeepSeek-Harness-Desktop-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness

portable:
  artifactName: DeepSeek-Harness-Desktop-${version}-portable.${ext}

publish:
  provider: github
  owner: pyljjun2009-sketch
  repo: '1'
  releaseType: release
