<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
  <title>设置</title>
  <style>
    :root { color-scheme: dark; } * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #0d1117; color: #c9d1d9; font-size: 13px; }
    .tabs { display: flex; border-bottom: 1px solid #30363d; padding: 0 16px; background: #161b22; }.tab { padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; color: #8b949e; }.tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
    .panel { display: none; padding: 20px 24px; }.panel.active { display: block; } h2 { font-size: 15px; margin-bottom: 14px; color: #f0f6fc; } label { display: block; margin-bottom: 10px; color: #8b949e; } label span { display: block; margin-bottom: 3px; }
    input, select { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 10px; border-radius: 6px; width: 100%; }.row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .btn { padding: 7px 16px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 13px; }.btn:hover { background: #30363d; }.btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }.btn.primary:hover { background: #388bfd; }.btn.danger { border-color: #f85149; color: #f85149; }.btn.danger:hover { background: #f85149; color: #fff; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }.badge.ok { background: #238636; color: #fff; }.badge.warn { background: #9e6a03; color: #fff; }.badge.err { background: #da3633; color: #fff; }.badge.info { background: #1f6feb; color: #fff; }
    .backup-list { max-height: 280px; overflow-y: auto; border: 1px solid #30363d; border-radius: 6px; }.backup-item { padding: 10px 14px; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; align-items: center; }.backup-item:last-child { border-bottom: none; }.backup-meta { font-size: 12px; color: #8b949e; }.backup-actions { display: flex; gap: 6px; }
    .status-card { padding: 12px 16px; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 10px; background: #161b22; }.empty { padding: 24px; text-align: center; color: #8b949e; }.toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; border-radius: 8px; background: #1f6feb; color: #fff; font-size: 13px; display: none; z-index: 999; }.toast.show { display: block; }.section-desc { font-size: 12px; color: #8b949e; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="tabs"><div class="tab active" data-tab="backup">备份管理</div><div class="tab" data-tab="crash">崩溃恢复</div><div class="tab" data-tab="upgrade">升级管理</div><div class="tab" data-tab="config">通用设置</div><div class="tab" data-tab="about">关于</div></div>
  <div class="panel active" id="panel-backup"><h2>数据备份</h2><p class="section-desc">备份 DSH profile（bundle 清单、patch 配置）。插件安装/升级前建议手动备份。</p><div class="row"><button class="btn primary" id="btn-create-backup">立即备份</button><input type="text" id="backup-note" placeholder="备注（可选）" style="width: 260px;" /></div><div class="backup-list" id="backup-list"><div class="empty">加载中…</div></div></div>
  <div class="panel" id="panel-crash"><h2>崩溃恢复</h2><p class="section-desc">检测上次退出状态，提供恢复/重置功能。</p><div id="crash-status"><div class="empty">加载中…</div></div><div id="profile-health" style="margin-top: 14px;"></div></div>
  <div class="panel" id="panel-upgrade"><h2>升级管理</h2><p class="section-desc">检测并管理桌面应用、DSH 后端和 Profile bundle 的更新。</p><div id="upgrade-status"><div class="empty">加载中…</div></div><div class="row" style="margin-top: 14px;"><button class="btn primary" id="btn-check-upgrade">检查所有更新</button><span id="upgrade-status-msg" style="font-size: 12px; color: #8b949e;"></span></div></div>
  <div class="panel" id="panel-config"><h2>通用设置</h2><div id="config-form"><label><span>GPU 渲染策略</span><select id="cfg-gpuMode"><option value="null">自动（平台默认）</option><option value="inprocess">inprocess（软件渲染，最稳定）</option><option value="off">off（软件渲染）</option><option value="auto">auto（硬件加速）</option></select></label><label><span>后端端口（0=自动）</span><input type="number" id="cfg-port" min="0" max="65535" /></label><label><span>后端监听地址</span><input type="text" id="cfg-host" /></label><label><input type="checkbox" id="cfg-keepRunning" /> 关窗后保持后端运行</label><label><input type="checkbox" id="cfg-reuseDsh" /> 尝试复用已有 dsh 后端实例</label><label><input type="checkbox" id="cfg-openBrowserOnCrash" /> 崩溃/异常关闭后自动打开浏览器访问 Web UI</label><div class="row" style="margin-top: 16px;"><button class="btn primary" id="btn-save-config">保存设置</button><span id="config-status" style="font-size: 12px; color: #8b949e;"></span></div></div></div>
  <div class="panel" id="panel-about"><h2>关于</h2><div class="status-card" id="about-info">加载中…</div></div>
  <div class="toast" id="toast"></div>
  <script src="settings.js"></script>
</body>
</html>
